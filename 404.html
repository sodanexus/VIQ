<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | VIQ</title>

    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #e8e0d0;
            --warm:  #c9b99a;
            --rust:  #8b3a1e;
            --red:   #b31300;
            --dark:  #0a0806;
            --mid:   #1a150f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark);
            color: var(--cream);
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: crosshair;
        }

        /* ── VIDEO BG ─────────────────────────────── */
        #bg-video {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: 35% 45%;
            z-index: -3;
        }

        /* ── FILM GRAIN ───────────────────────────── */
        .grain {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            opacity: 0.18;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            background-size: 180px 180px;
            animation: grain-drift 0.12s steps(1) infinite;
        }
        @keyframes grain-drift {
            0%   { background-position: 0 0; }
            10%  { background-position: -10px 5px; }
            20%  { background-position: 15px -8px; }
            30%  { background-position: -7px 12px; }
            40%  { background-position: 20px -3px; }
            50%  { background-position: -15px 8px; }
            60%  { background-position: 5px -14px; }
            70%  { background-position: -20px 2px; }
            80%  { background-position: 10px 10px; }
            90%  { background-position: -5px -5px; }
            100% { background-position: 0 0; }
        }

        /* ── VIGNETTE ─────────────────────────────── */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.7) 100%);
        }

        /* ── SCAN LINES ───────────────────────────── */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.08) 2px,
                rgba(0,0,0,0.08) 4px
            );
        }

        /* ── ENTRANCE FADE ────────────────────────── */
        .entrance-fade {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            pointer-events: none;
            animation: fade-out 1.2s forwards ease-out;
        }
        @keyframes fade-out {
            0%   { opacity: 1; }
            30%  { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* ── TAPE COUNTER ─────────────────────────── */
        .tape-counter {
            position: fixed;
            top: clamp(18px, 3vh, 32px);
            right: clamp(20px, 4vw, 40px);
            z-index: 20;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            color: rgba(232, 224, 208, 0.35);
            text-transform: uppercase;
            line-height: 1.6;
            text-align: right;
            pointer-events: none;
        }
        .tape-counter .tc-blinking {
            color: var(--red);
            animation: blink 1.4s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── GEO STAMP ────────────────────────────── */
        .geo-stamp {
            position: fixed;
            bottom: clamp(18px, 3vh, 32px);
            left: clamp(20px, 4vw, 40px);
            z-index: 20;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.12em;
            color: rgba(232, 224, 208, 0.28);
            text-transform: uppercase;
            pointer-events: none;
            line-height: 1.7;
        }

        /* ── MAIN UI ──────────────────────────────── */
        #ui {
            position: fixed;
            --mx: clamp(20px, 4vw, 40px);
            --my: clamp(32px, 6vh, 55px);
            inset: var(--my) var(--mx);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            z-index: 10;
        }

        /* ── 404 CONTENT ──────────────────────────── */
        .content-404 {
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }

        .error-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(0px, min(7.5vw, 9.5vmin), 80px);
            line-height: 0.92;
            color: var(--red);
            opacity: 0;
            animation: slide-in 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.3s;
            position: relative;
        }

        /* glitch ghost */
        .error-number::after {
            content: '404';
            position: absolute;
            left: 3px; top: 0;
            color: rgba(232,224,208,0.12);
            clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
            animation: scanline-glitch 5s infinite;
            animation-delay: 1.5s;
        }
        @keyframes scanline-glitch {
            0%, 88%, 100% { transform: translateX(0); opacity: 0; }
            90%            { transform: translateX(-4px); opacity: 1; }
            93%            { transform: translateX(4px); opacity: 1; }
            96%            { transform: translateX(-2px); opacity: 0.7; }
            98%            { transform: translateX(0); opacity: 0; }
        }

        .error-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(0px, min(7.5vw, 9.5vmin), 80px);
            line-height: 0.92;
            color: var(--cream);
            opacity: 0;
            animation: slide-in 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.45s;
            margin-bottom: clamp(10px, 2vh, 20px);
        }

        .separator {
            width: clamp(40px, 8vw, 80px);
            height: 1px;
            background: rgba(232,224,208,0.25);
            margin-bottom: clamp(10px, 2vh, 20px);
            opacity: 0;
            animation: slide-in 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.55s;
        }

        .error-sub {
            font-family: 'Crimson Pro', serif;
            font-style: italic;
            font-size: clamp(15px, 2.1vw, 21px);
            line-height: 1.7;
            color: var(--cream);
            opacity: 0;
            margin-bottom: clamp(14px, 2.5vh, 26px);
            animation: slide-in-dim 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.65s;
        }

        .home-link {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(0px, min(7.5vw, 9.5vmin), 80px);
            line-height: 0.92;
            color: var(--cream);
            text-decoration: none;
            display: inline-block;
            width: fit-content;
            opacity: 0;
            animation: slide-in 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.8s;
            transition: transform .3s cubic-bezier(.2,0,.2,1), color .3s ease;
            position: relative;
            padding-right: 25px;
            cursor: crosshair;
            margin-bottom: clamp(20px, 4vh, 40px);
        }
        .home-link::after {
            content: '';
            position: absolute;
            bottom: 8%;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--cream);
            transition: width .3s ease;
        }
        .home-link:hover { transform: translateX(12px); }
        .home-link:hover::after { width: calc(100% - 25px); }

        @keyframes slide-in {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-in-dim {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 0.85; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="entrance-fade"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <svg width="0" height="0" style="position:absolute">
        <defs>
            <filter id="wave-filter" x="-5%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB">
                <feTurbulence type="turbulence" baseFrequency="0.03 0.07" numOctaves="3" seed="5" result="noise">
                    <animate attributeName="baseFrequency"
                        values="0.03 0.07;0.025 0.055;0.032 0.065;0.03 0.07"
                        dur="3s" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="0"
                    xChannelSelector="R" yChannelSelector="G" id="flag-disp"/>
            </filter>
        </defs>
    </svg>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="Background.mp4" type="video/mp4">
    </video>

    <!-- tape counter top-right -->
    <div class="tape-counter">
        VIQ — REC<br>
        <span class="tc-blinking">● ERROR</span>
    </div>

    <!-- geo stamp bottom-left -->
    <div class="geo-stamp">
        48°51'N / 02°21'E<br>
        SIGNAL LOST
    </div>

    <div id="ui">
        <div class="content-404">
            <div class="error-number">404</div>
            <div class="error-label">Lost Signal</div>
            <div class="separator"></div>
            <div class="error-sub">This page doesn't exist — or has been moved.</div>
            <a href="/" class="home-link">← Back</a>
        </div>
    </div>

<script>
document.addEventListener('touchstart', function() {
    document.getElementById('bg-video').play();
}, { once: true });
</script>
</body>
</html>
