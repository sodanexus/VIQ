<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | VIQ</title>

    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #e8e0d0;
            --warm:  #c9b99a;
            --rust:  #8b3a1e;
            --red:   #b31300;
            --dark:  #0a0806;
            --mid:   #1a150f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark);
            color: var(--cream);
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: none;
        }
        @media (hover: none), (pointer: coarse) {
            body { cursor: auto; }
        }

        /* ── VIDEO BG ─────────────────────────────── */
        #bg-video {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: 35% 45%;
            z-index: -3;
        }

        /* ── ENTRANCE FADE ────────────────────────── */
        .entrance-fade {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            pointer-events: none;
            animation: fade-out 1.2s forwards ease-out;
        }
        @keyframes fade-out {
            0%   { opacity: 1; }
            30%  { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* ── GEO STAMP ────────────────────────────── */
        .geo-stamp {
            position: fixed;
            bottom: clamp(18px, 3vh, 32px);
            left: clamp(20px, 4vw, 40px);
            z-index: 20;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.12em;
            color: rgba(232, 224, 208, 0.28);
            text-transform: uppercase;
            pointer-events: none;
            line-height: 1.7;
        }

        /* ── MAIN UI ──────────────────────────────── */
        #ui {
            position: fixed;
            --mx: clamp(20px, 4vw, 40px);
            --my: clamp(32px, 6vh, 55px);
            inset: var(--my) var(--mx);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            z-index: 10;
        }

        /* ── 404 CONTENT ──────────────────────────── */
        .content-404 {
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }
        .content-404 > * { pointer-events: auto; }
        .content-404 .home-link { pointer-events: auto; }

        .error-number {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(0px, min(7.5vw, 9.5vmin), 68px);
            line-height: 0.97;
            text-transform: uppercase;
            color: var(--red);
            opacity: 0;
            animation: slide-in 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.3s;
            position: relative;
        }

        .error-label {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(0px, min(7.5vw, 9.5vmin), 68px);
            line-height: 0.97;
            text-transform: uppercase;
            color: var(--cream);
            opacity: 0;
            animation: slide-in 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.45s;
            margin-bottom: clamp(10px, 2vh, 20px);
        }

        .separator {
            width: clamp(40px, 8vw, 80px);
            height: 1px;
            background: rgba(232,224,208,0.25);
            margin-bottom: clamp(10px, 2vh, 20px);
            opacity: 0;
            animation: slide-in 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.55s;
        }

        .error-sub {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-style: normal;
            font-size: clamp(12px, 1.5vw, 15px);
            line-height: 1.8;
            color: rgba(232, 224, 208, 0.75);
            opacity: 0;
            margin-bottom: clamp(14px, 2.5vh, 26px);
            animation: slide-in-dim 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.65s;
        }

        .home-link {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(0px, min(7.5vw, 9.5vmin), 68px);
            line-height: 0.97;
            text-transform: uppercase;
            color: var(--cream);
            text-decoration: none;
            display: inline-block;
            width: fit-content;
            opacity: 0;
            animation: slide-in 0.6s cubic-bezier(.19,1,.22,1) forwards;
            animation-delay: 0.8s;
            transition: transform .3s cubic-bezier(.2,0,.2,1), color .3s ease;
            position: relative;
            padding-right: 25px;
            cursor: none;
            margin-bottom: clamp(20px, 4vh, 40px);
        }
        .home-link::after { display: none; }
        .home-link:hover { transform: translateX(12px); }

        @keyframes slide-in {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-in-dim {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 0.85; transform: translateY(0); }
        }

        /* ── CUSTOM CURSOR ─────────────────────────── */
        #cursor-dot, #cursor-ring {
            position: fixed;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 99998;
            will-change: transform;
        }
        #cursor-dot {
            width: 5px; height: 5px;
            margin: -2.5px 0 0 -2.5px;
            border-radius: 50%;
            background: var(--cream);
            transform: translate(var(--dx, -100px), var(--dy, -100px));
            transition: background 0.25s ease;
        }
        #cursor-ring {
            width: 32px; height: 32px;
            margin: -16px 0 0 -16px;
            transform: translate(var(--rx, -100px), var(--ry, -100px));
        }
        #cursor-ring .ring-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(232, 224, 208, 0.45);
            transition: border-color 0.3s ease, transform 0.2s cubic-bezier(.2,0,.2,1);
        }
        #cursor-dot.hovering { background: var(--red); }
        #cursor-ring.hovering .ring-inner {
            border-color: var(--red);
            transform: scale(0.55);
        }
        #cursor-ring.clicking .ring-inner {
            transform: scale(0.8);
        }
        @media (hover: none), (pointer: coarse) {
            #cursor-dot, #cursor-ring { display: none; }
        }
    </style>
</head>
<body>

    <div class="entrance-fade"></div>

    <!-- Custom cursor -->
    <div id="cursor-ring" aria-hidden="true"><div class="ring-inner"></div></div>
    <div id="cursor-dot" aria-hidden="true"></div>

    <svg width="0" height="0" style="position:absolute">
        <defs>
            <filter id="wave-filter" x="-5%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB">
                <feTurbulence type="turbulence" baseFrequency="0.03 0.07" numOctaves="3" seed="5" result="noise">
                    <animate attributeName="baseFrequency"
                        values="0.03 0.07;0.025 0.055;0.032 0.065;0.03 0.07"
                        dur="3s" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="0"
                    xChannelSelector="R" yChannelSelector="G" id="flag-disp"/>
            </filter>
        </defs>
    </svg>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="Background.mp4" type="video/mp4">
    </video>

    <!-- geo stamp bottom-left -->
    <div class="geo-stamp">
        48°51'N / 02°21'E<br>
        SIGNAL LOST
    </div>

    <div id="ui">
        <div class="content-404">
            <div class="error-number">404</div>
            <div class="error-label">Lost Signal</div>
            <div class="separator"></div>
            <div class="error-sub">This page doesn't exist — or has been moved.</div>
            <a href="/" class="home-link">← Back</a>
        </div>
    </div>

<script>
document.addEventListener('touchstart', function() {
    document.getElementById('bg-video').play();
}, { once: true });

// ── CUSTOM CURSOR ─────────────────────────────────────────
(function() {
    var dotEl  = document.getElementById('cursor-dot');
    var ringEl = document.getElementById('cursor-ring');
    if (!dotEl || !ringEl || matchMedia('(hover: none), (pointer: coarse)').matches) return;

    var mx = -100, my = -100;
    var rx = -100, ry = -100;
    var raf = null;

    function loop() {
        // The dot tracks the pointer almost instantly.
        dotEl.style.setProperty('--dx', mx.toFixed(1) + 'px');
        dotEl.style.setProperty('--dy', my.toFixed(1) + 'px');
        // The ring eases behind it for a soft trailing feel.
        rx += (mx - rx) * 0.30;
        ry += (my - ry) * 0.30;
        ringEl.style.setProperty('--rx', rx.toFixed(1) + 'px');
        ringEl.style.setProperty('--ry', ry.toFixed(1) + 'px');
        raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);

    window.addEventListener('mousemove', function(e) {
        mx = e.clientX;
        my = e.clientY;
        dotEl.style.opacity = '1';
        ringEl.style.opacity = '1';
    });

    document.addEventListener('mouseleave', function() {
        dotEl.style.opacity = '0';
        ringEl.style.opacity = '0';
    });
    document.addEventListener('mouseenter', function() {
        dotEl.style.opacity = '1';
        ringEl.style.opacity = '1';
    });

    window.addEventListener('mousedown', function() { ringEl.classList.add('clicking'); });
    window.addEventListener('mouseup',   function() { ringEl.classList.remove('clicking'); });

    var HOVER_SELECTOR = 'a, button, .nav-btn, [role="button"]';
    document.addEventListener('mouseover', function(e) {
        if (e.target.closest(HOVER_SELECTOR)) {
            dotEl.classList.add('hovering');
            ringEl.classList.add('hovering');
        }
    });
    document.addEventListener('mouseout', function(e) {
        if (e.target.closest(HOVER_SELECTOR) && !(e.relatedTarget && e.relatedTarget.closest(HOVER_SELECTOR))) {
            dotEl.classList.remove('hovering');
            ringEl.classList.remove('hovering');
        }
    });
})();
</script>
</body>
</html>
